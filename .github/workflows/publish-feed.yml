name: Publish update feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main, master]
    paths:
      - "VisualStudioUpdateRSS/**"
      - ".github/workflows/publish-feed.yml"

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate Visual Studio feed
        run: dotnet run --project VisualStudioUpdateRSS/VisualStudioUpdateRSS.csproj --configuration Release -- --output docs/visual-studio-2026.atom --timeline-output docs/visual-studio-2026.md
      - name: Generate Visual Studio Code feed
        run: dotnet run --project VisualStudioUpdateRSS/VisualStudioUpdateRSS.csproj --configuration Release -- --product vscode --output docs/vscode.atom --timeline-output docs/vscode.md

      - name: Verify generated feeds
        shell: bash
        run: |
          test -s docs/visual-studio-2026.atom
          test -s docs/visual-studio-2026.md
          test -s docs/vscode.atom
          test -s docs/vscode.md
          echo "Generated files:"
          ls -lh docs/visual-studio-2026.atom docs/visual-studio-2026.md docs/vscode.atom docs/vscode.md

      - name: Commit generated feeds
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/visual-studio-2026.atom docs/visual-studio-2026.md docs/vscode.atom docs/vscode.md
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Update generated release feeds"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
